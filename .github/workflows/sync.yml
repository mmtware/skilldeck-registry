name: Sync SkillDeck Registry

on:
  schedule:
    - cron: '0 0 * * *' # Her gece UTC 00:00'da otomatik günceller
  workflow_dispatch:     # Actions sekmesinden tek tıkla manuel çalıştırma butonu verir
  push:
    paths:
      - 'sources.json'   # sources.json güncellendiği an otomatik çalışır

permissions:
  contents: write        # Botun registry.json dosyasını repoya commit edebilmesi için şart

jobs:
  build-registry:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Update registry.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_registry.py

      - name: Commit and push changes
        run: |
          git config user.name "SkillDeck Bot"
          git config user.email "bot@skilldeck.app"
          git add registry.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: update skill stars and metadata" && git push)
